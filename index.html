<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow">
<title>읽기 연습 v1.3.1</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#20242c;--muted:#707783;--line:#e5e8ef;--accent:#5267d8;--accent2:#eef1ff;--danger:#b94747;--shadow:0 10px 30px rgba(32,36,44,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans JP",sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit}.app{max-width:780px;margin:auto;padding:18px 16px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}.top h1{font-size:1.25rem;margin:0}.iconbar{display:flex;gap:8px}.icon{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.tabs,.seg{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.tabs button.active,.seg button.active{background:var(--accent);border-color:var(--accent);color:#fff}.tabs{margin-bottom:18px}.field{margin-top:15px}.label{font-size:.88rem;font-weight:700;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.primary{width:100%;border:0;border-radius:14px;padding:13px 16px;background:var(--accent);color:#fff;font-weight:750;cursor:pointer;margin-top:18px}.secondary{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff;color:var(--text);font-weight:650;cursor:pointer;margin-top:9px}.primary:disabled,.secondary:disabled{opacity:.55;cursor:not-allowed}.hint{color:var(--muted);font-size:.82rem;margin-top:7px}.hidden{display:none!important}
.reading{font-size:1.04rem;white-space:pre-wrap;word-break:break-word;line-height:1.95}.reading ruby rt{font-size:.58em;color:var(--muted)}.vocab-link{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;background:rgba(82,103,216,.075);border-radius:3px;cursor:pointer}.vocab-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.word-popover{position:fixed;z-index:100;width:max-content;max-width:min(320px,calc(100vw - 24px));min-width:180px;padding:13px 15px;border:1px solid #bfc7fa;border-radius:14px;background:#fff;box-shadow:0 12px 36px rgba(32,36,44,.2);font-size:.92rem;line-height:1.55;overflow-wrap:anywhere}.word-popover .term{padding-right:22px}.word-popover .pop-close{position:absolute;right:7px;top:6px;border:0;border-radius:7px;background:#f1f2f6;padding:3px 8px;cursor:pointer}.reading-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.meta{font-size:.8rem;color:var(--muted)}.star{border:0;background:transparent;font-size:1.5rem;cursor:pointer;padding:4px 6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.actions button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;cursor:pointer;font-weight:650}.actions button.on{background:var(--accent2);border-color:#bfc7fa;color:#3449ba}.panel{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.panel h3{font-size:.95rem;margin:0 0 12px}.vocab{padding:12px 0;border-bottom:1px solid var(--line)}.vocab:last-child{border-bottom:0}.term{font-weight:800}.meaning{margin-top:3px}.note{color:var(--muted);font-size:.88rem;margin-top:3px}.translation{white-space:pre-wrap;line-height:1.8}.empty{text-align:center;color:var(--muted);padding:28px 8px}.status{text-align:center;color:var(--muted);padding:12px;font-size:.9rem}
.modal{position:fixed;inset:0;background:rgba(18,22,32,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}.modalbox{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.15)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{font-size:1.08rem;margin:0}.close{border:0;background:#f1f2f6;border-radius:10px;padding:7px 10px;cursor:pointer}.bigtext{width:100%;min-height:48vh;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:13px;line-height:1.7}.counter{text-align:right;color:var(--muted);font-size:.8rem;margin-top:5px}.setting{margin:16px 0}.setting label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}.setting input,.setting select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px}.records{display:flex;flex-direction:column;gap:9px}.record{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}.record-main{flex:1;min-width:0}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}.record .meta{margin-top:3px}.danger{color:var(--danger)}.smallbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}.divider{height:1px;background:var(--line);margin:18px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#252a34;color:#fff;padding:10px 14px;border-radius:12px;font-size:.88rem;z-index:80;box-shadow:var(--shadow);max-width:88%;text-align:center}
@media(max-width:520px){.app{padding:14px 12px 60px}.card{padding:15px;border-radius:17px}.row{grid-template-columns:1fr}.reading{font-size:1rem}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>읽기 연습</h1><div class="iconbar"><button class="icon" id="recordsBtn" aria-label="학습 기록">🕘</button><button class="icon" id="settingsBtn" aria-label="설정">⚙️</button></div></div>

  <section class="card">
    <div class="tabs" id="langTabs"><button data-v="en" class="active">English</button><button data-v="ja">日本語</button></div>

    <div class="field"><div class="label">형식</div><div class="seg" id="format"><button data-v="prose" class="active">줄글</button><button data-v="dialogue">대화문</button></div></div>

    <div class="field"><div class="label">난이도</div><div class="seg" id="difficulty"><button data-v="easy">편하게</button><button data-v="normal" class="active">적당히</button><button data-v="hard">빡세게</button></div></div>

    <div class="row">
      <div class="field"><div class="label">주제</div><select id="topic" class="select"><option value="random">랜덤</option><option value="game">게임</option><option value="food">음식</option><option value="daily">일상</option><option value="animal">동물</option><option value="culture">문화·여행</option><option value="science">과학·잡학</option></select></div>
      <div class="field"><div class="label">길이</div><div class="seg" id="length"><button data-v="short">짧게</button><button data-v="normal" class="active">보통</button><button data-v="long">길게</button></div></div>
    </div>

    <div class="field hidden" id="furiganaField"><div class="label">후리가나</div><div class="seg" id="furigana"><button data-v="all">전부</button><button data-v="hard" class="active">어려운 한자만</button><button data-v="none">없음</button></div></div>

    <button class="primary" id="generateBtn">읽을거리 만들기</button>
    <button class="secondary" id="importTextBtn">내 글 가져오기</button>
  </section>

  <div id="status" class="status hidden"></div>
  <section class="card hidden" id="readingCard">
    <div class="reading-head"><div class="meta" id="readingMeta"></div><button class="star" id="starBtn" title="보관">☆</button></div>
    <div class="reading" id="readingText"></div>
    <div class="hint hidden" id="vocabInlineHint">밑줄 친 표현을 누르면 바로 뜻을 볼 수 있어요.</div>
    <div class="actions"><button id="vocabBtn">단어 보기</button><button id="translationBtn">번역 보기</button></div>
    <div class="panel hidden" id="vocabPanel"><h3>단어·표현</h3><div id="vocabContent"></div></div>
    <div class="panel hidden" id="translationPanel"><h3>전체 번역</h3><div class="translation" id="translationContent"></div></div>
  </section>
</div>
<div class="word-popover hidden" id="wordPopover" role="dialog" aria-label="단어 뜻"></div>

<div class="modal hidden" id="textModal"><div class="modalbox"><div class="modalhead"><h2>내 글 가져오기</h2><button class="close" data-close="textModal">닫기</button></div><textarea id="customText" class="bigtext" maxlength="5000" placeholder="분석할 영어 또는 일본어 글을 붙여넣어 주세요. (최대 5,000자)"></textarea><div class="counter"><span id="charCount">0</span> / 5,000자</div><button class="primary" id="useCustomBtn">가져오기</button></div></div>

<div class="modal hidden" id="settingsModal"><div class="modalbox"><div class="modalhead"><h2>설정</h2><button class="close" data-close="settingsModal">닫기</button></div>
  <div class="setting"><label>English 사용자 수준</label><select id="levelEn"><option value="newbie">쌩뉴비</option><option value="beginner">초보 (유치원 수준)</option><option value="intermediate">중수 (초~중등)</option><option value="advanced">고수 (고등 이상)</option><option value="native">흡사 현지인</option></select></div>
  <div class="setting"><label>日本語 사용자 수준</label><select id="levelJa"><option value="newbie">쌩뉴비</option><option value="beginner">초보 (유치원 수준)</option><option value="intermediate">중수 (초~중등)</option><option value="advanced">고수 (고등 이상)</option><option value="native">흡사 현지인</option></select></div>
  <div class="setting"><label>Gemini API 키</label><input id="apiKey" type="password" autocomplete="off" placeholder="개인 Gemini API 키"/><div class="hint">이 브라우저에만 저장되며 데이터 백업에는 포함되지 않습니다.</div><button class="secondary" id="deleteApiKeyBtn" type="button">저장된 API 키 삭제</button></div>
  <div class="setting"><label>Gemini 모델</label><input id="modelName" type="text" value="gemini-3.8-flash" placeholder="예: gemini-3.8-flash"/></div>
  <button class="primary" id="saveSettingsBtn">설정 저장</button>
  <div class="divider"></div><h3 style="font-size:1rem">데이터 관리</h3><div class="hint">최근 일반 글 30개와 ★ 보관 글, 분석·번역 결과 및 학습 설정을 백업합니다.</div>
  <button class="secondary" id="exportBtn">학습 데이터 내보내기</button><button class="secondary" id="importBackupBtn">학습 데이터 가져오기</button><input id="backupFile" type="file" accept="application/json,.json" class="hidden"/>
</div></div>

<div class="modal hidden" id="recordsModal"><div class="modalbox"><div class="modalhead"><h2>최근 읽은 글</h2><button class="close" data-close="recordsModal">닫기</button></div><div id="recordsList" class="records"></div></div></div>
<script>
const K={settings:'readingPractice.settings.v1',api:'readingPractice.api.v1',records:'readingPractice.records.v1'};
const levelNames={newbie:'쌩뉴비',beginner:'초보',intermediate:'중수',advanced:'고수',native:'흡사 현지인'};
const diffNames={easy:'편하게',normal:'적당히',hard:'빡세게'}; const formatNames={prose:'줄글',dialogue:'대화문'}; const topicNames={random:'랜덤',game:'게임',food:'음식',daily:'일상',animal:'동물',culture:'문화·여행',science:'과학·잡학'}; const lenNames={short:'짧게',normal:'보통',long:'길게'};
let settings=load(K.settings,{levelEn:'beginner',levelJa:'newbie',model:'gemini-3.8-flash'}); let apiKey=localStorage.getItem(K.api)||''; let records=load(K.records,[]); let state={lang:'en',format:'prose',difficulty:'normal',topic:'random',length:'normal',furigana:'hard',current:null,busy:false};
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}} function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function setModal(id,on){$('#'+id).classList.toggle('hidden',!on)}
function seg(id,key){$('#'+id).addEventListener('click',e=>{let b=e.target.closest('button[data-v]');if(!b)return;$('#'+id).querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state[key]=b.dataset.v})}
seg('langTabs','lang');seg('format','format');seg('difficulty','difficulty');seg('length','length');seg('furigana','furigana');
$('#langTabs').addEventListener('click',()=>$('#furiganaField').classList.toggle('hidden',state.lang!=='ja')); $('#topic').addEventListener('change',e=>state.topic=e.target.value);
$$('[data-close]').forEach(b=>b.onclick=()=>setModal(b.dataset.close,false));
$('#settingsBtn').onclick=()=>openSettings(); $('#recordsBtn').onclick=()=>{renderRecords();setModal('recordsModal',true)}; $('#importTextBtn').onclick=()=>setModal('textModal',true);
$('#customText').oninput=e=>$('#charCount').textContent=e.target.value.length;
function openSettings(first=false){$('#levelEn').value=settings.levelEn;$('#levelJa').value=settings.levelJa;$('#apiKey').value=apiKey;$('#modelName').value=settings.model||'gemini-3.8-flash';setModal('settingsModal',true); if(first) toast('먼저 영어·일본어 학습 수준과 API 키를 설정해 주세요.')}
$('#saveSettingsBtn').onclick=()=>{settings={levelEn:$('#levelEn').value,levelJa:$('#levelJa').value,model:$('#modelName').value.trim()||'gemini-3.8-flash'};apiKey=$('#apiKey').value.trim();save(K.settings,settings);if(apiKey)localStorage.setItem(K.api,apiKey);else localStorage.removeItem(K.api);setModal('settingsModal',false);toast('설정을 저장했어요.')};
$('#deleteApiKeyBtn').onclick=()=>{if(!apiKey&&!localStorage.getItem(K.api)){toast('저장된 API 키가 없어요.');return}if(!confirm('이 브라우저에 저장된 API 키를 삭제할까요?'))return;apiKey='';localStorage.removeItem(K.api);$('#apiKey').value='';toast('저장된 API 키를 삭제했어요.')};
function currentLevel(){return state.lang==='en'?settings.levelEn:settings.levelJa}
function lengthGuide(){let lv=currentLevel();if(state.lang==='en'){let map={newbie:{short:'60–90 words',normal:'100–160 words',long:'180–260 words'},beginner:{short:'80–120 words',normal:'150–220 words',long:'280–380 words'},intermediate:{short:'100–150 words',normal:'200–300 words',long:'400–500 words'},advanced:{short:'120–180 words',normal:'250–350 words',long:'450–600 words'},native:{short:'150–220 words',normal:'300–450 words',long:'550–750 words'}};return map[lv][state.length]}let map={newbie:{short:'100–150 Japanese characters',normal:'200–300 Japanese characters',long:'400–500 Japanese characters'},beginner:{short:'150–220 Japanese characters',normal:'300–450 Japanese characters',long:'550–750 Japanese characters'},intermediate:{short:'200–300 Japanese characters',normal:'400–600 Japanese characters',long:'800–1000 Japanese characters'},advanced:{short:'250–350 Japanese characters',normal:'500–750 Japanese characters',long:'900–1200 Japanese characters'},native:{short:'300–450 Japanese characters',normal:'600–900 Japanese characters',long:'1000–1400 Japanese characters'}};return map[lv][state.length]}
function levelGuide(lv){return {newbie:'absolute beginner: assume almost no vocabulary or grammar knowledge; use extremely basic words and short simple sentences',beginner:'beginner: simple vocabulary and grammar comparable to early learner material',intermediate:'intermediate: upper-elementary to middle-school learner language',advanced:'advanced: high-school and above; mostly natural adult language',native:'near-native: use natural native-oriented prose with minimal learner simplification'}[lv]}
async function gemini(prompt,json=true){if(!apiKey){openSettings();throw new Error('API 키가 설정되지 않았어요.')}let model=(settings.model||'gemini-3.8-flash').trim();let url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;let body={contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:.8}};if(json) body.generationConfig.responseMimeType='application/json';let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw new Error(data?.error?.message||`API 오류 (${r.status})`);let text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();if(!text)throw new Error('AI 응답이 비어 있어요.');if(!json)return text;try{return JSON.parse(text)}catch{let m=text.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw new Error('AI 응답 형식을 읽지 못했어요.')}}
function setBusy(msg,on=true){state.busy=on;$('#status').textContent=msg;$('#status').classList.toggle('hidden',!on);$('#generateBtn').disabled=on;$('#useCustomBtn').disabled=on}
function recentSubtopics(){let eligible=records.filter(r=>r.source==='generated'&&r.lang===state.lang&&r.subtopic);if(state.topic!=='random')eligible=eligible.filter(r=>r.topic===state.topic);return eligible.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,state.topic==='random'?15:10).map(r=>r.subtopic)}
$('#generateBtn').onclick=async()=>{try{setBusy('읽을거리 만드는 중...');let lang=state.lang==='en'?'English':'Japanese';let fur=state.lang==='ja'?({all:'Add readings for every kanji using the exact notation 漢字[かんじ].',hard:'Add readings only to kanji that are likely difficult for this learner, using exact notation 漢字[かんじ].',none:'Do not add readings or bracket annotations.'}[state.furigana]):'';let recent=recentSubtopics();let avoid=recent.length?`Recent subtopics already used:\n${recent.map(x=>'- '+x).join('\n')}\nFirst choose a NEW concrete subtopic that is substantially different in situation, event, and development from these recent items. Do not merely rename the same scenario.`:`First choose a concrete, specific subtopic/situation within the selected topic. Avoid generic or clichéd material.`;let form=state.format==='dialogue'?`Write a natural conversational dialogue for adult language learning. Use 2–3 speakers in one concrete situation. Favor phrases people would actually say, including useful conversational chunks and responses, while keeping the language appropriate to the learner level. Avoid stiff textbook NPC-style question-answer repetition. Keep speaker labels clear and consistent.`:`Write a coherent prose reading passage (not a dialogue). It may resemble a short article, essay, anecdote, or informative story as appropriate. Use natural adult-oriented prose and a concrete angle rather than a generic overview.`;let prompt=`Create ONE ${lang} learning text for an ADULT foreign-language learner. Adult target is essential: easy language must NOT mean childish themes or preschool-style content.\nLearner level: ${levelNames[currentLevel()]} (${levelGuide(currentLevel())}).\nRelative challenge for this learner: ${diffNames[state.difficulty]}.\nFormat: ${formatNames[state.format]}. ${form}\nTopic: ${topicNames[state.topic]}; if random, choose a varied adult-interest topic.\nTarget length: ${lengthGuide()}.\n${fur}\n${avoid}\nWork in this order: (1) choose the concrete subtopic first, (2) write the content around that subtopic. The subtopic must be a short but specific Korean description of the actual situation/content, not a broad keyword such as "카페" or "게임".\nNo title, no translation, no vocabulary list, no explanation. Return JSON only: {"subtopic":"구체적인 한국어 세부 소재 설명","text":"..."}.`;let out=await gemini(prompt);let rec={id:crypto.randomUUID(),createdAt:new Date().toISOString(),source:'generated',lang:state.lang,level:currentLevel(),format:state.format,difficulty:state.difficulty,topic:state.topic,length:state.length,furigana:state.lang==='ja'?state.furigana:null,subtopic:String(out.subtopic||'').trim(),text:String(out.text||'').trim(),vocab:null,translation:null,starred:false};if(!rec.text)throw new Error('생성된 본문이 없어요.');addRecord(rec);showRecord(rec)}catch(e){toast(e.message)}finally{setBusy('',false)}};
$('#useCustomBtn').onclick=()=>{let text=$('#customText').value.trim();if(!text)return toast('가져올 글을 입력해 주세요.');let rec={id:crypto.randomUUID(),createdAt:new Date().toISOString(),source:'imported',lang:state.lang,level:currentLevel(),format:null,difficulty:null,topic:null,length:null,furigana:null,subtopic:null,text,vocab:null,translation:null,starred:false};addRecord(rec);setModal('textModal',false);$('#customText').value='';$('#charCount').textContent='0';showRecord(rec);toast('글을 가져왔어요.')};
function addRecord(rec){records.unshift(rec);trimRecords();save(K.records,records)} function trimRecords(){let unstar=records.filter(r=>!r.starred).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));let keep=new Set(unstar.slice(0,30).map(r=>r.id));records=records.filter(r=>r.starred||keep.has(r.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))}
function updateCurrent(){if(!state.current)return;let i=records.findIndex(r=>r.id===state.current.id);if(i>=0)records[i]=state.current;trimRecords();save(K.records,records)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderReading(s,lang){let safe=escapeHtml(s);if(lang==='ja')safe=safe.replace(/([一-龯々〆ヵヶ]+)\[([^\]\n]{1,30})\]/g,'<ruby>$1<rt>$2</rt></ruby>');return safe.replace(/\n/g,'<br>')}
// A matching item is linked only when BOTH the verbatim source sentence and
// the word/phrase as it appears in that sentence can be located. Older items
// have no sentence/surface and remain available in the ordinary vocabulary list.
let activeWord=null;
function closeWordPopup(){activeWord=null;$('#wordPopover').classList.add('hidden');$('#wordPopover').replaceChildren()}
function stripFurigana(s){return String(s||'').replace(/([一-龯々〆ヵヶ]+)\[([^\]\n]{1,30})\]/g,'$1')}
function normalizedWithMap(s){let text='',map=[];for(let i=0;i<s.length;i++){let ch=s[i];if(/\s/.test(ch)){if(!text.endsWith(' ')){text+=' ';map.push(i)}}else{text+=ch;map.push(i)}}return {text,map}}
function visibleTextMap(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  let raw='',places=[],node;
  while((node=walker.nextNode())){
    if(node.nodeType===Node.ELEMENT_NODE){if(node.tagName==='BR'){raw+='\n';places.push(null)}continue}
    if(node.parentElement?.closest('rt'))continue;
    for(let j=0;j<node.length;j++){raw+=node.data[j];places.push({node,offset:j})}
  }
  const normal=normalizedWithMap(raw);
  return {text:normal.text,places:normal.map.map(i=>places[i])};
}
function allOccurrences(haystack,needle){let out=[],start=0;if(!needle)return out;while((start=haystack.indexOf(needle,start))!==-1){out.push(start);start+=needle.length}return out}
function wordBoundaryOK(text,start,term){
  if(!/^[A-Za-z]/.test(term))return true;
  const end=start+term.length;
  return !(start>0&&/[A-Za-z]/.test(text[start-1]))&&!(end<text.length&&/[A-Za-z]/.test(text[end]));
}
function inlineMatches(items){
  const view=visibleTextMap($('#readingText'));
  const result=[],occupied=new Set();
  for(const item of items){
    // Old saved data lacks these fields: do not infer a position.
    const sentence=normalizedWithMap(stripFurigana(item.sentence||'')).text.trim();
    const surface=normalizedWithMap(stripFurigana(item.surface||'')).text.trim();
    if(!sentence||!surface||!sentence.includes(surface))continue;
    for(const sentenceStart of allOccurrences(view.text,sentence)){
      for(const localStart of allOccurrences(sentence,surface)){
        const start=sentenceStart+localStart,end=start+surface.length;
        if(!wordBoundaryOK(view.text,start,surface))continue;
        if(!view.places[start]||!view.places[end-1])continue;
        if([...Array(end-start).keys()].some(j=>occupied.has(start+j)))continue;
        result.push({start,end,item});
        for(let j=start;j<end;j++)occupied.add(j);
      }
    }
  }
  return result.sort((a,b)=>b.start-a.start);
}
function displayWordPopup(item,anchor){
  if(activeWord===anchor){closeWordPopup();return}
  const pop=$('#wordPopover');pop.replaceChildren();
  const title=document.createElement('div');title.className='term';title.textContent=stripFurigana(item.surface||'')||item.term||'';pop.appendChild(title);
  if(item.reading){const x=document.createElement('div');x.className='note';x.textContent=item.reading;pop.appendChild(x)}
  if(item.base){const x=document.createElement('div');x.className='note';x.textContent='기본형: '+item.base;pop.appendChild(x)}
  const meaning=document.createElement('div');meaning.className='meaning';meaning.textContent=item.meaning||'';pop.appendChild(meaning);
  if(item.note){const x=document.createElement('div');x.className='note';x.textContent=item.note;pop.appendChild(x)}
  const close=document.createElement('button');close.className='pop-close';close.type='button';close.textContent='×';close.setAttribute('aria-label','팝업 닫기');close.onclick=closeWordPopup;pop.appendChild(close);
  pop.classList.remove('hidden');activeWord=anchor;
  const rect=anchor.getBoundingClientRect();const width=pop.offsetWidth,height=pop.offsetHeight;
  const left=Math.max(12,Math.min(rect.left,window.innerWidth-width-12));
  let top=rect.top-height-9;if(top<12)top=rect.bottom+9;
  if(top+height>window.innerHeight-12)top=Math.max(12,window.innerHeight-height-12);
  pop.style.left=left+'px';pop.style.top=top+'px';
}
function renderInlineVocabulary(items){
  closeWordPopup();$('#vocabInlineHint').classList.add('hidden');
  if(!Array.isArray(items)||!items.some(x=>x?.sentence&&x?.surface))return;
  const root=$('#readingText'),matches=inlineMatches(items);
  // Reverse DOM order: inserting a later highlight cannot change earlier offsets.
  let count=0;
  for(const m of matches){
    const mapped=visibleTextMap(root);
    const first=mapped.places[m.start],last=mapped.places[m.end-1];
    if(!first||!last||first.node.parentElement?.closest('.vocab-link')||last.node.parentElement?.closest('.vocab-link'))continue;
    try{
      const range=document.createRange();range.setStart(first.node,first.offset);range.setEnd(last.node,last.offset+1);
      // The character map already verified the visible text. A ruby range's
      // toString() also includes <rt> readings, so do not compare that here.
      const mark=document.createElement('span');mark.className='vocab-link';mark.tabIndex=0;mark.setAttribute('role','button');mark.setAttribute('aria-label',`${m.item.surface}: 뜻 보기`);
      const fragment=range.extractContents();mark.appendChild(fragment);range.insertNode(mark);
      mark.addEventListener('click',e=>{e.stopPropagation();displayWordPopup(m.item,mark)});
      mark.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();displayWordPopup(m.item,mark)}});
      count++;
    }catch(e){/* A malformed AI span should never prevent reading or opening records. */}
  }
  $('#vocabInlineHint').classList.toggle('hidden',count===0);
}
document.addEventListener('pointerdown',e=>{if(activeWord&&!$('#wordPopover').contains(e.target)&&!e.target.closest('.vocab-link'))closeWordPopup()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWordPopup()});

function showRecord(rec){state.current=rec;state.lang=rec.lang;$('#langTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===rec.lang));$('#furiganaField').classList.toggle('hidden',rec.lang!=='ja');$('#readingCard').classList.remove('hidden');$('#readingText').innerHTML=renderReading(rec.text,rec.lang);renderInlineVocabulary(rec.vocab);let meta=rec.source==='generated'?[rec.lang==='en'?'English':'日本語',formatNames[rec.format||'prose']||'줄글',topicNames[rec.topic]||'AI 생성',diffNames[rec.difficulty]||'',lenNames[rec.length]||'',new Date(rec.createdAt).toLocaleDateString('ko-KR')].filter(Boolean):[rec.lang==='en'?'English':'日本語','가져온 글',new Date(rec.createdAt).toLocaleDateString('ko-KR')];$('#readingMeta').textContent=meta.join(' · ');$('#starBtn').textContent=rec.starred?'★':'☆';$('#vocabPanel').classList.add('hidden');$('#translationPanel').classList.add('hidden');$('#vocabBtn').classList.remove('on');$('#translationBtn').classList.remove('on');renderVocab(rec.vocab);$('#translationContent').textContent=rec.translation||'';refreshActionLabels();setModal('recordsModal',false);setTimeout(()=>$('#readingCard').scrollIntoView({behavior:'smooth',block:'start'}),50)}
$('#starBtn').onclick=()=>{if(!state.current)return;state.current.starred=!state.current.starred;$('#starBtn').textContent=state.current.starred?'★':'☆';updateCurrent();toast(state.current.starred?'자동 삭제되지 않도록 보관했어요.':'일반 기록으로 돌렸어요.')};
$('#vocabBtn').onclick=async()=>{if(!state.current)return;let panel=$('#vocabPanel');if(state.current.vocab){panel.classList.toggle('hidden');$('#vocabBtn').classList.toggle('on',!panel.classList.contains('hidden'));return}try{$('#vocabBtn').disabled=true;$('#vocabBtn').textContent='분석 중...';let r=state.current;let lang=r.lang==='en'?'English':'Japanese';let dialogueHint=r.format==='dialogue'?' Because this is a dialogue, actively select useful conversational chunks, natural responses, fixed phrases, and patterns worth learning as whole expressions; explain their contextual nuance when useful.':'';let prompt=`Analyze the following ${lang} passage for an ADULT Korean foreign-language learner. Learner level: ${levelNames[r.level]} (${levelGuide(r.level)}). Select words, idioms, fixed expressions, collocations, and useful grammar patterns the learner is likely not to know OR that are worth learning.${dialogueHint} Do not explain every easy word mechanically; adapt the amount to the learner level. For Japanese, include kana reading. For inflected Japanese forms, preferably show the expression as it appears and give the dictionary/base form when useful. Meanings and notes must be in Korean and must describe the exact surface form as used in its original sentence (including tense, politeness, negation, and context where relevant), not just a normalized term or dictionary form. IMPORTANT for precise inline lookup: For EACH vocabulary item, also return (a) "sentence": the exact COMPLETE sentence in which the expression occurs, copied verbatim from PASSAGE without paraphrasing, and (b) "surface": the exact word or contiguous phrase as it appears WITHIN that sentence (preserve inflections, spelling, case, and Japanese furigana annotations if present). The surface must be an exact substring of sentence. If a useful expression appears in multiple different sentences, you may include a separate entry for each meaning/context. Avoid inventing passages or extracting non-contiguous expressions. Return JSON only: {"items":[{"term":"term/expression","sentence":"exact original sentence","surface":"exact original word or phrase in that sentence","reading":"Japanese reading or empty","base":"base form or empty","meaning":"concise Korean meaning","note":"brief contextual/grammar note or empty"}]}. \n\nPASSAGE:\n${r.text}`;let out=await gemini(prompt);r.vocab=Array.isArray(out.items)?out.items:[];state.current=r;updateCurrent();renderVocab(r.vocab);renderInlineVocabulary(r.vocab);panel.classList.remove('hidden');$('#vocabBtn').classList.add('on')}catch(e){toast(e.message)}finally{$('#vocabBtn').disabled=false;refreshActionLabels()}};
function renderVocab(items){let box=$('#vocabContent');box.innerHTML='';if(!items)return;if(!items.length){box.innerHTML='<div class="empty">현재 수준에서 따로 뽑을 표현이 없어요.</div>';return}items.forEach(x=>{let d=document.createElement('div');d.className='vocab';let title=escapeHtml(stripFurigana(x.surface||'')||x.term||'');if(x.reading)title+=` <span class="note">(${escapeHtml(x.reading)})</span>`;d.innerHTML=`<div class="term">${title}</div>${x.base?`<div class="note">기본형: ${escapeHtml(x.base)}</div>`:''}<div class="meaning">${escapeHtml(x.meaning||'')}</div>${x.note?`<div class="note">${escapeHtml(x.note)}</div>`:''}`;box.appendChild(d)})}
$('#translationBtn').onclick=async()=>{if(!state.current)return;let panel=$('#translationPanel');if(state.current.translation){panel.classList.toggle('hidden');$('#translationBtn').classList.toggle('on',!panel.classList.contains('hidden'));return}try{$('#translationBtn').disabled=true;$('#translationBtn').textContent='번역 중...';let r=state.current;let prompt=`Translate the following ${r.lang==='en'?'English':'Japanese'} passage into natural Korean for comprehension checking. Preserve paragraph breaks and meaning. If the passage is a dialogue, preserve speaker labels, turn structure, and natural conversational tone. Do not add explanations, notes, summaries, or commentary. Return JSON only: {"translation":"..."}.\n\nPASSAGE:\n${r.text}`;let out=await gemini(prompt);r.translation=String(out.translation||'').trim();state.current=r;updateCurrent();$('#translationContent').textContent=r.translation;panel.classList.remove('hidden');$('#translationBtn').classList.add('on')}catch(e){toast(e.message)}finally{$('#translationBtn').disabled=false;refreshActionLabels()}};
function renderRecords(){let box=$('#recordsList');box.innerHTML='';if(!records.length){box.innerHTML='<div class="empty">아직 저장된 글이 없어요.</div>';return}records.forEach(r=>{let d=document.createElement('div');d.className='record';d.innerHTML=`<div style="font-size:1.15rem">${r.starred?'★':'○'}</div><div class="record-main"><div class="preview">${escapeHtml(r.text.replace(/\[[^\]]+\]/g,''))}</div><div class="meta">${r.source==='generated'?[r.lang==='en'?'English':'日本語',formatNames[r.format||'prose']||'줄글',topicNames[r.topic]||'AI 생성',diffNames[r.difficulty]||'',lenNames[r.length]||'',new Date(r.createdAt).toLocaleDateString('ko-KR')].filter(Boolean).join(' · '):[r.lang==='en'?'English':'日本語','가져온 글',new Date(r.createdAt).toLocaleDateString('ko-KR')].join(' · ')}</div></div><button class="smallbtn danger" title="삭제">삭제</button>`;d.querySelector('.record-main').onclick=()=>showRecord(r);d.firstElementChild.onclick=()=>showRecord(r);d.querySelector('button').onclick=e=>{e.stopPropagation();if(confirm('이 글을 삭제할까요?')){records=records.filter(x=>x.id!==r.id);save(K.records,records);if(state.current?.id===r.id){state.current=null;$('#readingCard').classList.add('hidden')}renderRecords()}};box.appendChild(d)})}
$('#exportBtn').onclick=()=>{let backup={app:'reading-practice',version:3,exportedAt:new Date().toISOString(),settings,records};let blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`reading-practice-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('백업 파일을 만들었어요. API 키는 포함되지 않았어요.')};
